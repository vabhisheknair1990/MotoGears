<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MotoGears API Docs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar-custom { background: #111827; color: #fff; padding: 14px 24px; font: 600 16px/1.2 system-ui, sans-serif; display: flex; gap: 12px; align-items: center; }
    .topbar-custom span { color: #ef4444; }
    .topbar-custom small { font-weight: 400; opacity: .7; }
  </style>
</head>
<body>
  <div class="topbar-custom">MotoGears<span>.</span> API <small>v1 · OpenAPI 3 · <a href="openapi.yaml" style="color:#fca5a5">openapi.yaml</a></small></div>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: window.location.pathname.replace(/\/?$/, '/').replace(/index\.html\/$/, '') + 'openapi.yaml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      persistAuthorization: true,
      docExpansion: 'none',
      defaultModelsExpandDepth: 0,
      tryItOutEnabled: true,
    });
  </script>
</body>
</html>
