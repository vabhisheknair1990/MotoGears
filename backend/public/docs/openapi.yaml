openapi: 3.0.3
info:
  title: MotoGears Automotive Parts API
  version: 1.0.0
  description: 'REST API for the MotoGears automobile parts & accessories store (Laravel + Sanctum).


    **Base URL:** `/api/v1` — future breaking changes will ship as `/api/v2`.


    **Response envelope:** every JSON response is `{ success, message, data, meta? }`. Paginated endpoints return `meta.current_page`, `last_page`,
    `per_page`, `total`.


    **Errors:** `401` unauthenticated, `403` forbidden, `404` not found, `422` validation (`errors` object keyed by field), `429` rate limited,
    `500` server error (no stack traces unless APP_DEBUG).


    **Auth:** send `Authorization: Bearer <token>` from `/auth/login` (customers) or `/admin/auth/login` (staff). Guests identify their cart with
    the `X-Cart-Token` header.


    **Demo credentials:** admin@example.com / password · customer@example.com / password'
servers:
- url: http://localhost:8000
  description: Local
tags:
- name: Authentication
  description: Customer & admin login, registration, password reset (Laravel Sanctum bearer tokens).
- name: Homepage
  description: Aggregated storefront homepage payload.
- name: Products
  description: Catalogue listing, filters, detail and compatibility.
- name: Categories
  description: Category tree.
- name: Brands
  description: Brands.
- name: Vehicles
  description: Make → Model → Year → Variant selector data.
- name: Search
  description: Full-text search, autocomplete and popular searches.
- name: Cart
  description: Guest (X-Cart-Token) and customer carts, coupons.
- name: Wishlist
  description: Customer wishlist.
- name: Checkout
  description: Checkout summary.
- name: Orders
  description: Place, pay, cancel, track and invoice orders.
- name: Payments
  description: Razorpay checkout verification, failure reporting and webhooks.
- name: Customers
  description: Customer profile, addresses, garage (saved vehicles), notifications.
- name: Reviews
  description: Product reviews.
- name: CMS
  description: Banners, pages, FAQs, blog, contact and newsletter.
- name: Admin
  description: Admin authentication, dashboard, lookups, notifications, audit log.
- name: Admin · Catalog
  description: Products, images, compatibility, attributes, categories, brands.
- name: Admin · Import
  description: 'Bulk product import from Excel: template, upload → background check → background import, progress and problem reports.'
- name: Admin · Vehicles
  description: Manufacturers, models and variants.
- name: Admin · Orders
  description: Order management and status workflow.
- name: Admin · Customers
  description: Customer management.
- name: Inventory
  description: Stock levels, adjustments and movement history.
- name: Coupons
  description: Coupon management.
- name: Admin · Reviews
  description: Review moderation.
- name: Reports
  description: Sales, product, customer and inventory reports.
- name: Admin · CMS
  description: Banners, pages, FAQs, blog, testimonials, enquiries, newsletter.
- name: Admin · System
  description: Settings, staff and roles.
