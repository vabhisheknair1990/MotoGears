                success: true
                message: FAQs retrieved successfully
                data:
                - category: Orders
                  items:
                  - id: 1
                    category: Orders
                    question: How do I know a part will fit my vehicle?
                    answer: Select your vehicle using the Make → Model → Year → Variant selector. Products that fit are marked with a green "Fits
                      your vehicle" badge, and every product page lists all compatible vehicles.
                  - id: 2
                    category: Orders
                    question: Can I cancel my order?
                    answer: Yes. You can cancel from My Orders any time before the order is packed. Prepaid orders are refunded automatically
                      to the original payment method.
                - category: Payments
                  items:
                  - id: 4
                    category: Payments
                    question: Which payment methods do you accept?
                    answer: Cash on Delivery (up to ₹50,000), cards and UPI. This demo store simulates card and UPI payments — no real money is
                      charged.
                  - id: 5
                    category: Payments
                    question: Is Cash on Delivery available everywhere?
                    answer: COD is available across most serviceable PIN codes for orders up to ₹50,000.
