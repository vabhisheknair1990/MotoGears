      summary: Upload a file and start the background check
      operationId: POST_admin_product_imports
      description: '`file`: .xlsx, .xls or .csv up to 10 MB / 5,000 products. `mode`: `upsert` (default — match by SKU, add new and update existing),
        `create` (skip existing SKUs) or `update` (skip new SKUs). The file is checked by the queue worker with nothing saved (every product is
        saved inside a transaction that is rolled back), so the result matches what a real import would do. `auto_start=1` imports straight away
        when the check finds no problems. Poll `GET /admin/product-imports/{id}` for progress.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                mode:
                  type: string
                auto_start:
                  type: boolean
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
