    post:
      tags:
      - Orders
      summary: Place an order from the cart
      operationId: POST_orders
      description: 'Stock is validated and reserved inside a transaction. `payment_method`: `cod`, `razorpay` (when configured), `demo_card` (card
        ending 0002 declines) or `demo_upi` (`failure@upi` fails). For `razorpay` the order is created as pending and the response contains `data.razorpay`
        — the public options for Razorpay checkout.js (key id, Razorpay order id, amount in paise). Open checkout with them, then POST the result
        to `/orders/{order}/razorpay/verify`. Alternatively send `shipping_address` (object) with `save_address: true`. A failed payment still
        creates the order in `pending` with `payment_status: failed`; retry via `/orders/{order}/pay`.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shipping_address_id:
                  type: integer
                billing_same_as_shipping:
                  type: boolean
                shipping_method:
                  type: string
                payment_method:
                  type: string
                payment_details:
                  type: object
                  properties:
                    card_number:
                      type: string
                    card_name:
                      type: string
                    expiry:
                      type: string
                    cvv:
                      type: string
                notes:
                  type: string
            example:
              shipping_address_id: 1
              billing_same_as_shipping: true
              shipping_method: standard
              payment_method: demo_card
              payment_details:
                card_number: 4111 1111 1111 1111
                card_name: Aarav Menon
                expiry: 12/29
                cvv: '123'
              notes: Please call before delivery
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      order:
                        $ref: '#/components/schemas/Order'
                      payment:
                        type: object
                      payment_successful:
                        type: boolean
                      razorpay:
                        $ref: '#/components/schemas/RazorpayCheckout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
