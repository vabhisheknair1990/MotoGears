server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 40m;

  # Resolve "backend" through Docker's DNS on every request (cached 10s) instead of once at startup,
  # so a restarted/rebuilt backend container (new IP) never leaves nginx answering 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:8000;

  # Same-origin API: the production build calls /api/v1 (see environment.prod.ts).
  location /api/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /storage/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
  }

  # Long-cache hashed bundles; never cache index.html.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback for Angular routes (/products/..., /admin/...).
  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
